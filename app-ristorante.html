<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>La Bottega dell'Idilia — Gestione tavoli</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #F6F1E4;
    --surface: #FFFDF8;
    --surface-2: #EFE7D4;
    --ink: #2B241C;
    --muted: #857A68;
    --wine: #6E2B37;
    --wine-dark: #55212A;
    --olive: #6F7B45;
    --olive-dark: #59632F;
    --amber: #C1793F;
    --line: #E3D9C2;
    --radius-s: 6px;
    --radius-m: 10px;
    --radius-l: 16px;
    --shadow: 0 2px 10px rgba(43,36,28,0.08);
    --shadow-lift: 0 8px 28px rgba(43,36,28,0.16);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }
  .brand{
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
  }
  #app{ display:flex; flex-direction:column; height:100%; min-height:100vh; }

  /* HEADER */
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px;
    background:var(--wine);
    color:#F6EFE0;
    position:sticky; top:0; z-index:20;
    box-shadow: var(--shadow);
  }
  header .brand-group{ display:flex; align-items:center; gap:10px; min-width:0; }
  header .logo-badge{
    width:38px; height:38px; border-radius:50%; flex:0 0 auto;
    background:#F6EFE0; color:var(--wine);
    display:flex; align-items:center; justify-content:center;
    font-family:Georgia,serif; font-weight:700; font-size:14px; letter-spacing:0.5px;
    overflow:hidden; border:1px solid rgba(246,239,224,0.5);
  }
  .logo-badge img{ width:100%; height:100%; object-fit:cover; }
  header .title{ display:flex; flex-direction:column; line-height:1.15; min-width:0; }
  header .title .name{ font-family: Georgia, serif; font-size:17px; letter-spacing:0.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header .title .sub{ font-size:11px; color:#E3C9B8; margin-top:2px; }
  header .actions{ display:flex; gap:8px; flex:0 0 auto; }
  .edit-banner{
    background:var(--amber); color:#3A2612; font-size:12.5px; text-align:center;
    padding:8px 14px; line-height:1.4;
  }
  .icon-btn{
    background:rgba(255,255,255,0.12);
    border:none; color:#F6EFE0; width:38px; height:38px; border-radius:10px;
    display:flex; align-items:center; justify-content:center; font-size:18px; cursor:pointer;
  }
  .icon-btn:active{ background:rgba(255,255,255,0.24); }
  .icon-btn.on{ background:#F6EFE0; color:var(--wine); }

  /* SYNC PILL */
  .sync-pill{
    font-size:10px; color:#E3C9B8; display:flex; align-items:center; gap:5px; margin-top:2px;
  }
  .sync-dot{ width:6px; height:6px; border-radius:50%; background:#9FBF7A; }

  /* FLOOR */
  main{ flex:1; padding:16px; padding-bottom:90px; max-width:720px; width:100%; margin:0 auto; }
  .floor-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
    gap:14px;
  }
  .table-card{
    aspect-ratio: 1 / 1;
    background:var(--surface);
    border:2px solid var(--line);
    border-radius:var(--radius-l);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px;
    cursor:pointer;
    position:relative;
    transition: transform .12s ease;
    box-shadow: var(--shadow);
  }
  .table-card:active{ transform: scale(0.96); }
  .table-card.round{ border-radius:50%; }
  .table-card .t-name{ font-weight:600; font-size:15px; text-align:center; padding:0 8px; }
  .table-card .t-seats{ font-size:11px; color:var(--muted); }
  .table-card .t-status{
    position:absolute; top:10px; right:10px;
    width:10px; height:10px; border-radius:50%;
    background:#C7BEA7;
  }
  .table-card.status-libero{ border-color:var(--line); }
  .table-card.status-libero .t-status{ background:#B9C7A2; }
  .table-card.status-comanda{ border-color:var(--amber); background:#FBF1E3; }
  .table-card.status-comanda .t-status{ background:var(--amber); }
  .table-card .t-total{ font-size:12px; color:var(--wine); font-weight:600; }
  .table-card .t-edit-badge{
    position:absolute; bottom:8px; right:8px; font-size:11px; color:var(--muted);
  }

  .add-table-card{
    aspect-ratio:1/1;
    border:2px dashed var(--line);
    border-radius:var(--radius-l);
    display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:28px; cursor:pointer; background:transparent;
  }
  .add-table-card:active{ background:var(--surface-2); }

  .empty-hint{ text-align:center; color:var(--muted); font-size:13px; margin-top:40px; line-height:1.5; }

  /* OVERLAYS */
  .overlay{
    position:fixed; inset:0; background:rgba(43,36,28,0.45);
    z-index:40; display:flex; justify-content:flex-end;
    opacity:0; pointer-events:none; transition:opacity .18s ease;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .panel{
    background:var(--bg);
    width:100%; max-width:480px; height:100%;
    display:flex; flex-direction:column;
    transform: translateX(24px);
    transition: transform .18s ease;
    box-shadow: var(--shadow-lift);
  }
  .overlay.open .panel{ transform: translateX(0); }
  .panel-header{
    background:var(--wine); color:#F6EFE0; padding:14px 16px;
    display:flex; align-items:center; gap:10px;
    position:sticky; top:0; z-index:2;
  }
  .panel-header input.name-edit{
    background:transparent; border:none; border-bottom:1px solid rgba(246,239,224,0.4);
    color:#F6EFE0; font-family:Georgia,serif; font-size:19px; padding:2px 0; flex:1; min-width:0;
  }
  .panel-header input.name-edit:focus{ outline:none; border-bottom-color:#F6EFE0; }
  .panel-body{ flex:1; overflow-y:auto; padding:14px 16px 100px; }
  .panel-close{ margin-left:auto; }

  .section-label{ font-size:12px; text-transform:none; color:var(--muted); font-weight:600; margin:18px 0 8px; }
  .section-label:first-child{ margin-top:0; }

  .order-line{
    background:var(--surface); border-radius:var(--radius-m); padding:10px 12px;
    margin-bottom:8px; box-shadow:var(--shadow);
  }
  .order-line .line-row{ display:flex; align-items:center; gap:10px; }
  .order-line .li-info{ flex:1; min-width:0; }
  .order-line .li-name{ font-weight:600; font-size:14px; }
  .order-line .li-meta{ font-size:12px; color:var(--muted); margin-top:2px; }
  .note-input{
    width:100%; margin-top:8px; border:1px solid var(--line); border-radius:8px;
    padding:7px 10px; font-size:12.5px; background:var(--bg); color:var(--ink);
  }
  .note-input::placeholder{ color:#B3A98F; }
  .qty-ctrl{ display:flex; align-items:center; gap:6px; }
  .qty-ctrl button{
    width:26px; height:26px; border-radius:8px; border:1px solid var(--line); background:var(--surface-2);
    font-size:15px; cursor:pointer; color:var(--ink);
  }
  .qty-ctrl span{ min-width:18px; text-align:center; font-weight:600; font-size:14px; }
  .weight-input{
    width:58px; border:1px solid var(--line); border-radius:8px; padding:4px 6px; font-size:13px; text-align:right;
  }
  .remove-line{ background:none; border:none; color:#B4573F; font-size:18px; cursor:pointer; padding:4px; }

  .total-bar{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--surface-2); border-radius:var(--radius-m); padding:12px 14px; margin-top:6px;
    font-weight:700; font-size:15px;
  }
  .total-bar .lbl{ font-weight:500; font-size:13px; color:var(--muted); }

  .cat-tabs{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:10px; }
  .cat-tab{
    flex:0 0 auto; padding:7px 14px; border-radius:999px; border:1px solid var(--line);
    background:var(--surface); font-size:13px; cursor:pointer; color:var(--ink); white-space:nowrap;
  }
  .cat-tab.active{ background:var(--olive); border-color:var(--olive); color:#fff; }

  .menu-item-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:11px 4px; border-bottom:1px solid var(--line); cursor:pointer;
  }
  .menu-item-row:last-child{ border-bottom:none; }
  .menu-item-row .mi-name{ font-size:14px; font-weight:500; }
  .menu-item-row .mi-price{ font-size:13px; color:var(--muted); }
  .menu-item-row .mi-tag{ font-size:10px; color:var(--olive-dark); }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:11px 16px; border-radius:var(--radius-m); border:none; font-size:14px; font-weight:600;
    cursor:pointer;
  }
  .btn-primary{ background:var(--wine); color:#F6EFE0; }
  .btn-primary:active{ background:var(--wine-dark); }
  .btn-outline{ background:transparent; border:1px solid var(--line); color:var(--ink); }
  .btn-outline:active{ background:var(--surface-2); }
  .btn-danger{ background:#B4573F; color:#fff; }
  .btn-block{ width:100%; }
  .btn-ghost{ background:none; color:var(--wine); border:none; font-weight:600; font-size:13px; padding:6px 2px; cursor:pointer; }

  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:12px; color:var(--muted); margin-bottom:5px; font-weight:600; }
  .field input, .field select{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:var(--radius-m);
    font-size:14px; background:var(--surface); color:var(--ink);
  }
  .row2{ display:flex; gap:10px; }
  .row2 > .field{ flex:1; }
  .checkbox-field{ display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .checkbox-field input{ width:18px; height:18px; }
  .checkbox-field label{ font-size:13px; color:var(--ink); font-weight:500; }

  .shape-picker{ display:flex; gap:10px; }
  .shape-opt{
    flex:1; padding:14px; border:2px solid var(--line); border-radius:var(--radius-m);
    text-align:center; cursor:pointer; font-size:13px; color:var(--muted);
  }
  .shape-opt.selected{ border-color:var(--wine); color:var(--wine); background:#F8EEE9; font-weight:600; }

  .cat-block{ margin-bottom:22px; }
  .cat-block-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .cat-block-head .cname{ font-weight:700; font-size:15px; }
  .cat-block-body{ background:var(--surface); border-radius:var(--radius-m); box-shadow:var(--shadow); padding:2px 12px; }
  .link-danger{ color:#B4573F; font-size:12px; cursor:pointer; background:none; border:none; }

  .modal-mini{
    position:fixed; inset:0; background:rgba(43,36,28,0.5); z-index:60;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal-mini .sheet{
    background:var(--bg); width:100%; max-width:480px; border-radius:18px 18px 0 0;
    padding:18px 16px 22px; max-height:88vh; overflow-y:auto;
  }
  .modal-mini h3{ margin:0 0 14px; font-family:Georgia,serif; font-size:19px; }
  .sheet-actions{ display:flex; gap:10px; margin-top:16px; }
  .sheet-actions .btn{ flex:1; }

  .fab-add{
    position:fixed; right:20px; bottom:20px; z-index:15;
    width:56px; height:56px; border-radius:50%; background:var(--olive); color:#fff;
    border:none; font-size:26px; box-shadow:var(--shadow-lift); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .fab-add:active{ background:var(--olive-dark); }

  @media (min-width:600px){
    .overlay{ background:rgba(43,36,28,0.35); }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  /* ---------- utils ---------- */
  const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
  const eur = (n) => (Math.round((n||0)*100)/100).toFixed(2).replace('.', ',') + ' €';
  const escapeHtml = (s) => (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  /* ---------- default data ---------- */
  function defaultTables(){
    return [
      {id: uid(), name:'Tavolo 1', shape:'round', seats:2},
      {id: uid(), name:'Tavolo 2', shape:'round', seats:4},
      {id: uid(), name:'Tavolo 3', shape:'square', seats:4},
      {id: uid(), name:'Tavolo 4', shape:'square', seats:6},
    ];
  }
  function defaultMenu(){
    return [
      {id:uid(), name:'Bevande', items:[
        {id:uid(), name:'Acqua naturale', price:2.0, weight:false},
        {id:uid(), name:'Coca Cola', price:3.5, weight:false},
        {id:uid(), name:'Spritz', price:6.0, weight:false},
      ]},
      {id:uid(), name:'Alcolici', items:[
        {id:uid(), name:'Calice vino rosso', price:4.5, weight:false},
        {id:uid(), name:'Birra alla spina 0,4L', price:5.0, weight:false},
      ]},
      {id:uid(), name:'Cibo', items:[
        {id:uid(), name:'Bruschetta', price:5.0, weight:false},
        {id:uid(), name:'Panino', price:7.0, weight:false},
      ]},
      {id:uid(), name:'Taglieri', items:[
        {id:uid(), name:'Prosciutto crudo', price:3.5, weight:true},
        {id:uid(), name:'Salame', price:3.0, weight:true},
        {id:uid(), name:'Pecorino', price:4.0, weight:true},
      ]},
      {id:uid(), name:'Dolci', items:[
        {id:uid(), name:'Tiramisù', price:5.5, weight:false},
      ]},
    ];
  }

  /* ---------- state ---------- */
  let state = {
    tables: [],
    menu: [],
    orders: {}, // tableId -> [ {id, itemId, name, categoryName, price, qty, weight(g|null), unitLabel} ]
  };
  let ui = {
    editMode: false,
    openTableId: null,
    activeCat: null,
    menuManagerOpen: false,
    menuManagerCat: null,
    modal: null, // {type:'add-table'|'edit-table'|'add-item'|'edit-item'|'add-cat', ...}
    lastSavedTick: 0,
  };

  const SUPABASE_URL = 'https://kthkxlfrybtpslxqtugn.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt0aGt4bGZyeWJ0cHNseHF0dWduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5MTI0OTMsImV4cCI6MjEwNDQ4ODQ5M30.PZTYiKp68FfgAeKsb7yL60FoJ7CX4afaifFo_A-biFQ';
  const ROW_ID = 'main';
  const hasStorage = !!(window.supabase && SUPABASE_URL);
  const sb = hasStorage ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
  let connError = false;

  async function loadAll(){
    if(!hasStorage){ seedIfEmpty(); render(); return; }
    try{
      const { data, error } = await sb.from('app_state').select('*').eq('id', ROW_ID).single();
      if(error) throw error;
      state.tables = (data && data.tables && data.tables.length) ? data.tables : defaultTables();
      state.menu = (data && data.menu && data.menu.length) ? data.menu : defaultMenu();
      state.orders = (data && data.orders) ? data.orders : {};
      if(!data || !data.tables || !data.tables.length || !data.menu || !data.menu.length){
        await sb.from('app_state').update({ tables: state.tables, menu: state.menu, orders: state.orders }).eq('id', ROW_ID);
      }
    }catch(e){
      console.error('load error', e);
      connError = true;
      seedIfEmpty();
    }
    render();
    subscribeRealtime();
    startPolling();
  }
  function seedIfEmpty(){
    if(state.tables.length===0) state.tables = defaultTables();
    if(state.menu.length===0) state.menu = defaultMenu();
  }
  async function persist(which){
    ui.lastSavedTick = Date.now();
    if(!hasStorage) return;
    try{
      const payload = { updated_at: new Date().toISOString() };
      payload[which] = state[which];
      const { error } = await sb.from('app_state').update(payload).eq('id', ROW_ID);
      if(error) throw error;
      connError = false;
    }catch(e){ console.error('save error', e); connError = true; render(); }
  }

  function applyRemoteRow(row){
    if(!row) return false;
    let changed = false;
    if(row.tables && JSON.stringify(row.tables)!==JSON.stringify(state.tables)){ state.tables = row.tables; changed = true; }
    if(row.menu && JSON.stringify(row.menu)!==JSON.stringify(state.menu)){ state.menu = row.menu; changed = true; }
    if(row.orders && JSON.stringify(row.orders)!==JSON.stringify(state.orders)){ state.orders = row.orders; changed = true; }
    return changed;
  }

  function subscribeRealtime(){
    if(!hasStorage) return;
    try{
      sb.channel('app_state_changes')
        .on('postgres_changes', { event:'UPDATE', schema:'public', table:'app_state', filter:`id=eq.${ROW_ID}` }, (payload)=>{
          if(Date.now() - ui.lastSavedTick < 1200) return; // skip echo of our own save
          if(applyRemoteRow(payload.new)) render();
        })
        .subscribe();
    }catch(e){ console.error('realtime subscribe error', e); }
  }

  let polling = false;
  function startPolling(){
    if(polling || !hasStorage) return;
    polling = true;
    // safety-net poll in case realtime misses an update (e.g. brief disconnect)
    setInterval(async ()=>{
      if(Date.now() - ui.lastSavedTick < 1500) return;
      try{
        const { data, error } = await sb.from('app_state').select('*').eq('id', ROW_ID).single();
        if(error) throw error;
        connError = false;
        if(applyRemoteRow(data)) render();
      }catch(e){ connError = true; }
    }, 6000);
  }

  /* ---------- derived ---------- */
  function tableOrders(tableId){ return state.orders[tableId] || []; }
  function tableTotal(tableId){
    return tableOrders(tableId).reduce((sum, l) => sum + lineTotal(l), 0);
  }
  function lineTotal(l){
    if(l.weight!=null) return (l.price * (l.weight/100)) * l.qty;
    return l.price * l.qty;
  }
  function tableStatus(tableId){
    return tableOrders(tableId).length > 0 ? 'comanda' : 'libero';
  }

  /* ---------- render ---------- */
  function render(){
    const app = document.getElementById('app');
    app.innerHTML = `
      ${header()}
      <main>${ui.editMode ? '' : ''}${floorGrid()}</main>
      ${ui.editMode ? `<button class="fab-add" onclick="App.openAddTable()">+</button>` : ''}
      ${ui.openTableId ? tablePanel() : ''}
      ${ui.menuManagerOpen ? menuManagerPanel() : ''}
      ${ui.modal ? modalMarkup() : ''}
    `;
    // focus name input if editing table name
    if(ui.openTableId){
      const inp = document.getElementById('tname-input');
      if(inp && document.activeElement !== inp){ /* no auto-focus to avoid keyboard popping constantly */ }
    }
  }

  function header(){
    return `
      <header>
        <div class="brand-group">
          <div class="logo-badge" id="logo-slot">BI</div>
          <div class="title">
            <div class="name brand">La Bottega dell'Idilia</div>
            <div class="sync-pill"><span class="sync-dot" style="background:${!hasStorage ? '#C7BEA7' : (connError ? '#B4573F' : '#9FBF7A')}"></span>${!hasStorage ? 'Connessione non disponibile' : (connError ? 'Connessione assente — riprovo…' : 'Sincronizzato tra dispositivi')}</div>
          </div>
        </div>
        <div class="actions">
          <button class="icon-btn ${ui.editMode?'on':''}" onclick="App.toggleEdit()" title="Modifica tavoli">✎</button>
          <button class="icon-btn" onclick="App.openMenuManager()" title="Gestisci menu">☰</button>
        </div>
      </header>
      ${ui.editMode ? `<div class="edit-banner">Modalità modifica: tocca un tavolo per modificarlo o eliminarlo, oppure tocca "+" per aggiungerne uno nuovo.</div>` : ''}
    `;
  }

  function floorGrid(){
    if(state.tables.length===0){
      return `<div class="empty-hint">Nessun tavolo ancora.<br>Tocca ✎ in alto per aggiungerne uno.</div>`;
    }
    const cards = state.tables.map(t=>{
      const status = tableStatus(t.id);
      const total = tableTotal(t.id);
      return `
        <div class="table-card ${t.shape} status-${status}" onclick="${ui.editMode ? `App.openEditTable('${t.id}')` : `App.openTable('${t.id}')`}">
          <span class="t-status"></span>
          <div class="t-name">${escapeHtml(t.name)}</div>
          <div class="t-seats">${t.seats} coperti</div>
          ${status==='comanda' ? `<div class="t-total">${eur(total)}</div>` : ''}
          ${ui.editMode ? `<div class="t-edit-badge">modifica</div>` : ''}
        </div>
      `;
    }).join('');
    return `<div class="floor-grid">${cards}${ui.editMode ? `<div class="add-table-card" onclick="App.openAddTable()">+</div>` : ''}</div>`;
  }

  function tablePanel(){
    const t = state.tables.find(x=>x.id===ui.openTableId);
    if(!t) return '';
    const lines = tableOrders(t.id);
    const cats = state.menu;
    if(!ui.activeCat && cats.length) ui.activeCat = cats[0].id;
    const activeCat = cats.find(c=>c.id===ui.activeCat) || cats[0];

    const linesHtml = lines.length ? lines.map(l => `
      <div class="order-line">
        <div class="line-row">
          <div class="li-info">
            <div class="li-name">${escapeHtml(l.name)}</div>
            <div class="li-meta">${l.weight!=null ? `${eur(l.price)} /100g` : eur(l.price)} · ${l.categoryName}</div>
          </div>
          ${l.weight!=null ? `
            <input class="weight-input" type="number" min="0" step="10" value="${l.weight}" onchange="App.setWeight('${l.id}', this.value)"> g
          ` : ''}
          <div class="qty-ctrl">
            <button onclick="App.changeQty('${l.id}', -1)">−</button>
            <span>${l.qty}</span>
            <button onclick="App.changeQty('${l.id}', 1)">+</button>
          </div>
          <button class="remove-line" onclick="App.removeLine('${l.id}')">×</button>
        </div>
        <input class="note-input" type="text" placeholder="Nota per la cucina (es. senza cipolla)" value="${escapeHtml(l.note||'')}" onchange="App.setNote('${l.id}', this.value)">
      </div>
    `).join('') : `<div class="empty-hint" style="margin-top:8px;">Nessun elemento in comanda.<br>Aggiungi dal menu qui sotto.</div>`;

    const tabsHtml = cats.map(c => `
      <button class="cat-tab ${c.id===activeCat?.id?'active':''}" onclick="App.setActiveCat('${c.id}')">${escapeHtml(c.name)}</button>
    `).join('');

    const itemsHtml = (activeCat?.items||[]).map(it => `
      <div class="menu-item-row" onclick="App.addLine('${activeCat.id}','${it.id}')">
        <div>
          <div class="mi-name">${escapeHtml(it.name)}</div>
          ${it.weight ? `<div class="mi-tag">venduto al peso</div>` : ''}
        </div>
        <div class="mi-price">${it.weight ? eur(it.price)+' /100g' : eur(it.price)}</div>
      </div>
    `).join('') || `<div class="empty-hint">Categoria vuota.</div>`;

    return `
      <div class="overlay open" onclick="if(event.target===this) App.closeTable()">
        <div class="panel">
          <div class="panel-header">
            <input id="tname-input" class="name-edit" value="${escapeHtml(t.name)}" onchange="App.renameTable('${t.id}', this.value)">
            <button class="icon-btn panel-close" onclick="App.closeTable()">✕</button>
          </div>
          <div class="panel-body">
            <div class="section-label">Comanda</div>
            ${linesHtml}
            <div class="total-bar">
              <span class="lbl">Totale tavolo</span>
              <span>${eur(tableTotal(t.id))}</span>
            </div>

            <div class="section-label">Aggiungi elemento</div>
            <div class="cat-tabs">${tabsHtml}</div>
            <div class="cat-block-body">${itemsHtml}</div>
          </div>
        </div>
      </div>
    `;
  }

  function menuManagerPanel(){
    const cats = state.menu;
    const blocks = cats.map(c => `
      <div class="cat-block">
        <div class="cat-block-head">
          <div class="cname">${escapeHtml(c.name)}</div>
          <div style="display:flex; gap:14px;">
            <button class="link-danger" style="color:var(--olive-dark);" onclick="App.openAddItem('${c.id}')">+ elemento</button>
            <button class="link-danger" onclick="App.deleteCategory('${c.id}')">elimina categoria</button>
          </div>
        </div>
        <div class="cat-block-body">
          ${(c.items||[]).map(it => `
            <div class="menu-item-row" onclick="App.openEditItem('${c.id}','${it.id}')">
              <div>
                <div class="mi-name">${escapeHtml(it.name)}</div>
                ${it.weight ? `<div class="mi-tag">venduto al peso</div>` : ''}
              </div>
              <div class="mi-price">${it.weight ? eur(it.price)+' /100g' : eur(it.price)}</div>
            </div>
          `).join('') || `<div class="empty-hint" style="margin:6px 0;">Nessun elemento.</div>`}
        </div>
      </div>
    `).join('');

    return `
      <div class="overlay open" onclick="if(event.target===this) App.closeMenuManager()">
        <div class="panel">
          <div class="panel-header">
            <div class="name-edit brand" style="font-family:Georgia,serif; font-size:19px;">Gestione menu</div>
            <button class="icon-btn panel-close" onclick="App.closeMenuManager()">✕</button>
          </div>
          <div class="panel-body">
            ${blocks || `<div class="empty-hint">Nessuna categoria.</div>`}
            <button class="btn btn-outline btn-block" onclick="App.openAddCategory()">+ Nuova categoria</button>
          </div>
        </div>
      </div>
    `;
  }

  function modalMarkup(){
    const m = ui.modal;
    if(!m) return '';
    let title = '', body = '', actions = '';

    if(m.type==='add-table' || m.type==='edit-table'){
      const editing = m.type==='edit-table';
      const t = editing ? state.tables.find(x=>x.id===m.id) : {name:'', shape:'round', seats:4};
      title = editing ? 'Modifica tavolo' : 'Nuovo tavolo';
      body = `
        <div class="field"><label>Nome tavolo</label><input id="m-name" value="${escapeHtml(t.name)}" placeholder="Es. Tavolo terrazza"></div>
        <div class="field">
          <label>Forma</label>
          <div class="shape-picker">
            <div class="shape-opt ${t.shape==='round'?'selected':''}" onclick="App.pickShape('round')" id="shape-round">Rotondo</div>
            <div class="shape-opt ${t.shape==='square'?'selected':''}" onclick="App.pickShape('square')" id="shape-square">Quadrato</div>
          </div>
        </div>
        <div class="field"><label>Coperti</label><input id="m-seats" type="number" min="1" max="20" value="${t.seats}"></div>
      `;
      actions = `
        ${editing ? `<button class="btn btn-danger" onclick="App.deleteTable('${t.id}')">Elimina</button>` : ''}
        <button class="btn btn-primary" onclick="App.saveTable(${editing ? `'${t.id}'` : 'null'})">Salva</button>
      `;
    }

    if(m.type==='add-category'){
      title = 'Nuova categoria';
      body = `<div class="field"><label>Nome categoria</label><input id="m-catname" placeholder="Es. Antipasti"></div>`;
      actions = `<button class="btn btn-primary btn-block" onclick="App.saveCategory()">Salva</button>`;
    }

    if(m.type==='add-item' || m.type==='edit-item'){
      const editing = m.type==='edit-item';
      const cat = state.menu.find(c=>c.id===m.catId);
      const it = editing ? cat.items.find(i=>i.id===m.itemId) : {name:'', price:'', weight:false};
      title = editing ? 'Modifica elemento' : `Nuovo elemento — ${escapeHtml(cat.name)}`;
      body = `
        <div class="field"><label>Nome</label><input id="m-iname" value="${escapeHtml(it.name)}" placeholder="Es. Spritz"></div>
        <div class="checkbox-field">
          <input type="checkbox" id="m-iweight" ${it.weight?'checked':''} onchange="App.toggleWeightLabel()">
          <label for="m-iweight">Venduto al peso (es. affettati, taglieri)</label>
        </div>
        <div class="field"><label id="m-iprice-label">${it.weight ? 'Prezzo al etto (100g)' : 'Prezzo'}</label><input id="m-iprice" type="number" min="0" step="0.1" value="${it.price}" placeholder="0,00"></div>
      `;
      actions = `
        ${editing ? `<button class="btn btn-danger" onclick="App.deleteItem('${m.catId}','${it.id}')">Elimina</button>` : ''}
        <button class="btn btn-primary" onclick="App.saveItem('${m.catId}', ${editing ? `'${it.id}'` : 'null'})">Salva</button>
      `;
    }

    return `
      <div class="modal-mini" onclick="if(event.target===this) App.closeModal()">
        <div class="sheet">
          <h3>${title}</h3>
          ${body}
          <div class="sheet-actions">${actions}</div>
          <button class="btn-ghost" style="width:100%; margin-top:4px;" onclick="App.closeModal()">Annulla</button>
        </div>
      </div>
    `;
  }

  /* ---------- actions ---------- */
  const App = {
    toggleEdit(){ ui.editMode = !ui.editMode; render(); },

    openTable(id){ ui.openTableId = id; ui.activeCat = null; render(); },
    closeTable(){ ui.openTableId = null; render(); },
    renameTable(id, val){
      const t = state.tables.find(x=>x.id===id); if(!t) return;
      t.name = val.trim() || t.name;
      persist('tables'); render();
    },
    setActiveCat(id){ ui.activeCat = id; render(); },

    addLine(catId, itemId){
      const cat = state.menu.find(c=>c.id===catId); const it = cat.items.find(i=>i.id===itemId);
      const tid = ui.openTableId;
      if(!state.orders[tid]) state.orders[tid] = [];
      const existing = !it.weight ? state.orders[tid].find(l=>l.itemId===itemId) : null;
      if(existing){ existing.qty += 1; }
      else{
        state.orders[tid].push({
          id: uid(), itemId: it.id, name: it.name, categoryName: cat.name,
          price: it.price, qty: 1, weight: it.weight ? 100 : null, note: ''
        });
      }
      persist('orders'); render();
    },
    changeQty(lineId, delta){
      const tid = ui.openTableId; const arr = state.orders[tid] || [];
      const l = arr.find(x=>x.id===lineId); if(!l) return;
      l.qty += delta;
      if(l.qty <= 0){ state.orders[tid] = arr.filter(x=>x.id!==lineId); }
      persist('orders'); render();
    },
    setWeight(lineId, val){
      const tid = ui.openTableId; const l = (state.orders[tid]||[]).find(x=>x.id===lineId); if(!l) return;
      l.weight = Math.max(0, parseFloat(val)||0);
      persist('orders'); render();
    },
    setNote(lineId, val){
      const tid = ui.openTableId; const l = (state.orders[tid]||[]).find(x=>x.id===lineId); if(!l) return;
      l.note = val;
      persist('orders');
      // no re-render on every keystroke: keeps focus in the input while typing
    },
    removeLine(lineId){
      const tid = ui.openTableId;
      state.orders[tid] = (state.orders[tid]||[]).filter(x=>x.id!==lineId);
      persist('orders'); render();
    },

    openMenuManager(){ ui.menuManagerOpen = true; render(); },
    closeMenuManager(){ ui.menuManagerOpen = false; render(); },

    openAddTable(){ ui.modal = {type:'add-table', shape:'round'}; render(); },
    openEditTable(id){ const t = state.tables.find(x=>x.id===id); ui.modal = {type:'edit-table', id, shape:t.shape}; render(); },
    pickShape(shape){ ui.modal.shape = shape; render(); document.getElementById('m-name')?.focus(); },
    saveTable(id){
      const name = document.getElementById('m-name').value.trim() || (id ? state.tables.find(t=>t.id===id).name : 'Nuovo tavolo');
      const seats = Math.max(1, parseInt(document.getElementById('m-seats').value)||4);
      const shape = ui.modal.shape;
      if(id){
        const t = state.tables.find(x=>x.id===id);
        t.name = name; t.seats = seats; t.shape = shape;
      } else {
        if(state.tables.length >= 10){ alert('Massimo 10 tavoli.'); return; }
        state.tables.push({id: uid(), name, seats, shape});
      }
      persist('tables'); ui.modal = null; render();
    },
    deleteTable(id){
      if(!confirm('Eliminare questo tavolo e la sua comanda?')) return;
      state.tables = state.tables.filter(t=>t.id!==id);
      delete state.orders[id];
      persist('tables'); persist('orders');
      ui.modal = null; render();
    },

    openAddCategory(){ ui.modal = {type:'add-category'}; render(); },
    saveCategory(){
      const name = document.getElementById('m-catname').value.trim();
      if(!name) return;
      state.menu.push({id: uid(), name, items: []});
      persist('menu'); ui.modal = null; render();
    },
    deleteCategory(id){
      if(!confirm('Eliminare questa categoria e tutti i suoi elementi?')) return;
      state.menu = state.menu.filter(c=>c.id!==id);
      persist('menu'); render();
    },

    openAddItem(catId){ ui.modal = {type:'add-item', catId}; render(); },
    openEditItem(catId, itemId){ ui.modal = {type:'edit-item', catId, itemId}; render(); },
    toggleWeightLabel(){
      const on = document.getElementById('m-iweight').checked;
      document.getElementById('m-iprice-label').textContent = on ? 'Prezzo al etto (100g)' : 'Prezzo';
    },
    saveItem(catId, itemId){
      const name = document.getElementById('m-iname').value.trim();
      const price = parseFloat(document.getElementById('m-iprice').value) || 0;
      const weight = document.getElementById('m-iweight').checked;
      if(!name) return;
      const cat = state.menu.find(c=>c.id===catId);
      if(itemId){
        const it = cat.items.find(i=>i.id===itemId);
        it.name = name; it.price = price; it.weight = weight;
      } else {
        cat.items.push({id: uid(), name, price, weight});
      }
      persist('menu'); ui.modal = null; render();
    },
    deleteItem(catId, itemId){
      const cat = state.menu.find(c=>c.id===catId);
      cat.items = cat.items.filter(i=>i.id!==itemId);
      persist('menu'); ui.modal = null; render();
    },

    closeModal(){ ui.modal = null; render(); },
  };
  window.App = App;

  loadAll();
})();
</script>
</body>
</html>
